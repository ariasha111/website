<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1512 600" width="1512" height="600" fill="none">
  <title>Характер в каждом знаке — устройство букв А, Б, С</title>
  <desc>Перекладина слегка занижена для лучшей читаемости и баланса формы. Четкий прямой угол подчеркивает геометрию буквы. Большой радиус закругления подчеркивает современный и открытый характер.</desc>

